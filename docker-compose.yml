services:
  # --- PostgreSQL Database ---
  prefect-db:
    image: postgres:16-alpine
    container_name: prefect_postgres
    networks:
      - prefect_network
    restart: always
    environment:
      - POSTGRES_USER=prefect
      - POSTGRES_PASSWORD=pwd123
      - POSTGRES_DB=prefect_server
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U prefect -d prefect_server"]
      interval: 5s
      timeout: 5s
      retries: 5

  # --- Prefect Server ---
  prefect-server:
    image: prefecthq/prefect:3-latest
    container_name: prefect_server
    networks:
      - prefect_network
    restart: always
    entrypoint: ["prefect", "server", "start"]
    environment:
      - PREFECT_API_DATABASE_CONNECTION_URL=postgresql+asyncpg://prefect:pwd123@prefect-db:5432/prefect_server
      - PREFECT_SERVER_API_HOST=0.0.0.0
      - PREFECT_API_URL=http://localhost:4200/api
    ports:
      - "4200:4200"
    depends_on:
      prefect-db:
        condition: service_healthy
    volumes:
      - prefect_server_data:/root/.prefect

volumes:
  postgres_data:
  prefect_server_data:

networks:
  prefect_network:
    driver: bridge
